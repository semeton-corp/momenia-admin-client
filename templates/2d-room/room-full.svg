<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" shape-rendering="crispEdges">
  <title>Pixel bedroom — full room</title>
  <!-- surround -->
  <rect width="320" height="240" fill="#d9485f"/>
  <!-- room block -->
  <rect x="14" y="10" width="292" height="220" fill="#f7f1e5"/>
  <rect x="14" y="10" width="292" height="220" fill="none" stroke="#2b2135" stroke-width="6"/>
  <!-- right wall shade -->
  <rect x="180" y="10" width="126" height="140" fill="#efe6d4"/>
  <!-- floor -->
  <rect x="14" y="150" width="292" height="80" fill="#7a5233"/>
  <rect x="14" y="150" width="292" height="6" fill="#5d3d24"/>
  <g fill="#5d3d24">
    <rect x="14" y="168" width="292" height="3"/>
    <rect x="14" y="188" width="292" height="3"/>
    <rect x="14" y="208" width="292" height="3"/>
  </g>
  <g fill="#8f6238">
    <rect x="40" y="153" width="10" height="77"/>
    <rect x="90" y="153" width="10" height="77"/>
    <rect x="150" y="153" width="10" height="77"/>
    <rect x="210" y="153" width="10" height="77"/>
    <rect x="260" y="153" width="10" height="77"/>
  </g>
  <!-- rug -->
  <ellipse cx="160" cy="212" rx="110" ry="20" fill="#a8e6a1"/>
  <ellipse cx="160" cy="212" rx="110" ry="20" fill="none" stroke="#2b2135" stroke-width="4"/>
  <!-- window -->
  <rect x="36" y="28" width="86" height="96" fill="#bfe6f5"/>
  <rect x="36" y="28" width="86" height="96" fill="none" stroke="#2b2135" stroke-width="5"/>
  <rect x="75" y="28" width="8" height="96" fill="#2b2135"/>
  <rect x="36" y="70" width="86" height="8" fill="#2b2135"/>
  <rect x="44" y="34" width="12" height="80" fill="#ffffff" opacity="0.55"/>
  <!-- curtains -->
  <rect x="22" y="22" width="20" height="110" fill="#8fd694"/>
  <rect x="22" y="22" width="20" height="110" fill="none" stroke="#2b2135" stroke-width="4"/>
  <rect x="118" y="22" width="20" height="110" fill="#8fd694"/>
  <rect x="118" y="22" width="20" height="110" fill="none" stroke="#2b2135" stroke-width="4"/>
  <rect x="18" y="18" width="124" height="8" fill="#2b2135"/>
  <!-- cat silhouette -->
  <g fill="#14141c">
    <rect x="96" y="78" width="16" height="30"/>
    <rect x="92" y="66" width="24" height="16"/>
    <rect x="92" y="60" width="7" height="10"/>
    <rect x="109" y="60" width="7" height="10"/>
    <rect x="108" y="104" width="8" height="22"/>
    <rect x="100" y="122" width="22" height="6"/>
  </g>
  <!-- tall plant -->
  <g>
    <rect x="66" y="150" width="26" height="20" fill="#8a5a2b"/>
    <rect x="66" y="150" width="26" height="20" fill="none" stroke="#2b2135" stroke-width="4"/>
    <g fill="#3f7d3a">
      <rect x="72" y="112" width="8" height="42"/>
      <rect x="62" y="122" width="10" height="30"/>
      <rect x="80" y="122" width="10" height="30"/>
    </g>
    <g fill="#6fbf5f">
      <rect x="74" y="112" width="4" height="42"/>
    </g>
  </g>
  <!-- small succulent -->
  <g>
    <rect x="44" y="162" width="22" height="14" fill="#e8a13c"/>
    <rect x="44" y="162" width="22" height="14" fill="none" stroke="#2b2135" stroke-width="3"/>
    <g fill="#2f6b2f">
      <rect x="48" y="150" width="6" height="14"/>
      <rect x="56" y="150" width="6" height="14"/>
      <rect x="52" y="146" width="6" height="18"/>
    </g>
  </g>
  <!-- side stool + leafy plant -->
  <g>
    <rect x="148" y="118" width="34" height="12" fill="#b07a45"/>
    <rect x="148" y="118" width="34" height="12" fill="none" stroke="#2b2135" stroke-width="4"/>
    <rect x="152" y="130" width="6" height="34" fill="#6b4423"/>
    <rect x="172" y="130" width="6" height="34" fill="#6b4423"/>
    <rect x="158" y="100" width="16" height="18" fill="#e8a13c"/>
    <rect x="158" y="100" width="16" height="18" fill="none" stroke="#2b2135" stroke-width="3"/>
    <g fill="#3f7d3a">
      <rect x="164" y="60" width="8" height="42"/>
      <rect x="146" y="72" width="22" height="10"/>
      <rect x="168" y="72" width="24" height="10"/>
      <rect x="152" y="88" width="20" height="10"/>
      <rect x="172" y="88" width="20" height="10"/>
    </g>
    <g fill="#c2455f">
      <rect x="142" y="72" width="14" height="10"/>
      <rect x="182" y="66" width="14" height="12"/>
    </g>
  </g>
  <!-- painting -->
  <g>
    <rect x="206" y="36" width="84" height="52" fill="#f6c453"/>
    <rect x="206" y="36" width="84" height="52" fill="none" stroke="#8a5a2b" stroke-width="6"/>
    <polygon points="206,88 232,36 250,36 222,88" fill="#f28ba8"/>
    <polygon points="250,36 290,36 290,62 268,62" fill="#9ad0c2"/>
    <polygon points="222,88 258,88 258,60 240,60" fill="#f28ba8"/>
  </g>
  <!-- bed -->
  <g>
    <rect x="196" y="106" width="70" height="60" fill="#8a8fa8"/>
    <rect x="196" y="106" width="70" height="60" fill="none" stroke="#2b2135" stroke-width="5"/>
    <rect x="204" y="116" width="24" height="18" fill="#f2a7b8"/>
    <rect x="204" y="116" width="24" height="18" fill="none" stroke="#2b2135" stroke-width="3"/>
    <rect x="232" y="116" width="24" height="18" fill="#f2a7b8"/>
    <rect x="232" y="116" width="24" height="18" fill="none" stroke="#2b2135" stroke-width="3"/>
    <rect x="96" y="150" width="170" height="52" fill="#fdf6ec"/>
    <rect x="96" y="150" width="170" height="52" fill="none" stroke="#2b2135" stroke-width="5"/>
    <rect x="150" y="150" width="100" height="52" fill="#f2a7b8"/>
    <rect x="150" y="150" width="100" height="52" fill="none" stroke="#2b2135" stroke-width="4"/>
    <g fill="#e07f92">
      <rect x="162" y="160" width="12" height="4"/>
      <rect x="182" y="166" width="12" height="4"/>
      <rect x="202" y="160" width="12" height="4"/>
      <rect x="172" y="178" width="12" height="4"/>
      <rect x="196" y="182" width="12" height="4"/>
      <rect x="220" y="174" width="12" height="4"/>
    </g>
  </g>
  <!-- nightstand + lamp -->
  <g>
    <rect x="266" y="162" width="30" height="42" fill="#6b4423"/>
    <rect x="266" y="162" width="30" height="42" fill="none" stroke="#2b2135" stroke-width="4"/>
    <polygon points="266,148 296,148 290,162 272,162" fill="#f6c453"/>
    <polygon points="266,148 296,148 290,162 272,162" fill="none" stroke="#2b2135" stroke-width="4"/>
    <rect x="278" y="162" width="8" height="16" fill="#e8a13c"/>
    <rect x="278" y="162" width="8" height="16" fill="none" stroke="#2b2135" stroke-width="3"/>
  </g>
</svg>
