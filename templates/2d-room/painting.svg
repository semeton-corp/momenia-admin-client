<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" shape-rendering="crispEdges">
  <title>Pixel wall painting</title>
  <rect width="200" height="120" fill="#f7f1e5"/>
  <rect x="10" y="10" width="180" height="100" fill="#f6c453"/>
  <rect x="10" y="10" width="180" height="100" fill="none" stroke="#8a5a2b" stroke-width="10"/>
  <rect x="10" y="10" width="180" height="100" fill="none" stroke="#2b2135" stroke-width="3"/>
  <polygon points="10,110 70,10 110,10 50,110" fill="#f28ba8"/>
  <polygon points="110,10 190,10 190,50 150,50" fill="#9ad0c2"/>
  <polygon points="50,110 130,110 130,66 90,66" fill="#f28ba8"/>
  <polygon points="130,110 190,110 190,80 160,80" fill="#efe6d4"/>
</svg>
