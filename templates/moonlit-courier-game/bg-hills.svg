<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" shape-rendering="crispEdges">
  <title>Moonlit festival night backdrop</title>
  <rect x="0" y="0" width="320" height="62" fill="#1b2340"/>
  <rect x="0" y="62" width="320" height="28" fill="#2a2f55"/>
  <rect x="0" y="90" width="320" height="30" fill="#333a5e"/>
  <!-- moon -->
  <rect x="254" y="14" width="28" height="28" fill="#fdf3d0"/>
  <rect x="260" y="22" width="6" height="6" fill="#e8d8a0"/>
  <rect x="270" y="30" width="4" height="4" fill="#e8d8a0"/>
  <!-- stars -->
  <g fill="#ffffff">
    <rect x="18" y="12" width="2" height="2"/>
    <rect x="52" y="30" width="2" height="2"/>
    <rect x="88" y="10" width="2" height="2"/>
    <rect x="120" y="26" width="2" height="2"/>
    <rect x="150" y="12" width="2" height="2"/>
    <rect x="188" y="34" width="2" height="2"/>
    <rect x="214" y="10" width="2" height="2"/>
    <rect x="36" y="48" width="2" height="2"/>
    <rect x="104" y="46" width="2" height="2"/>
    <rect x="170" y="50" width="2" height="2"/>
    <rect x="238" y="52" width="2" height="2"/>
    <rect x="300" y="56" width="2" height="2"/>
  </g>
  <!-- far hills -->
  <rect x="0" y="72" width="70" height="20" fill="#4a4f7a"/>
  <rect x="60" y="66" width="110" height="26" fill="#4a4f7a"/>
  <rect x="220" y="70" width="100" height="22" fill="#4a4f7a"/>
  <!-- festival tent silhouette -->
  <polygon points="248,92 272,58 296,92" fill="#3a3f66"/>
  <rect x="270" y="50" width="4" height="10" fill="#3a3f66"/>
  <polygon points="248,92 272,58 296,92" fill="none" stroke="#14141c" stroke-width="2"/>
  <!-- string lights -->
  <rect x="0" y="44" width="320" height="1" fill="#0e1120"/>
  <g>
    <rect x="14" y="45" width="3" height="3" fill="#f6c453"/>
    <rect x="44" y="45" width="3" height="3" fill="#ff6b6b"/>
    <rect x="74" y="45" width="3" height="3" fill="#9ad0c2"/>
    <rect x="104" y="45" width="3" height="3" fill="#f6c453"/>
    <rect x="134" y="45" width="3" height="3" fill="#ff6b6b"/>
    <rect x="164" y="45" width="3" height="3" fill="#9ad0c2"/>
    <rect x="194" y="45" width="3" height="3" fill="#f6c453"/>
    <rect x="224" y="45" width="3" height="3" fill="#ff6b6b"/>
  </g>
  <!-- near ground -->
  <rect x="0" y="104" width="320" height="16" fill="#232a4a"/>
  <rect x="0" y="104" width="320" height="2" fill="#6fbf5f"/>
</svg>
