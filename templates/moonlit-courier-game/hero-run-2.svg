<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 28" shape-rendering="crispEdges">
  <title>Hooded courier — run frame 2</title>
  <!-- hood -->
  <rect x="10" y="0" width="3" height="1" fill="#3e3a7a"/>
  <rect x="9" y="1" width="5" height="1" fill="#3e3a7a"/>
  <rect x="8" y="2" width="7" height="1" fill="#3e3a7a"/>
  <rect x="7" y="3" width="9" height="1" fill="#3e3a7a"/>
  <rect x="7" y="4" width="4" height="5" fill="#2e2c5e"/>
  <rect x="8" y="4" width="3" height="5" fill="#3e3a7a"/>
  <rect x="11" y="4" width="5" height="5" fill="#ffd9b3"/>
  <rect x="14" y="6" width="1" height="1" fill="#2b2135"/>
  <rect x="15" y="7" width="1" height="1" fill="#ff9f9f"/>
  <rect x="8" y="9" width="8" height="1" fill="#2e2c5e"/>
  <!-- scarf wrap + tail level -->
  <rect x="6" y="10" width="4" height="1" fill="#ff6b6b"/>
  <rect x="1" y="10" width="6" height="1" fill="#ff6b6b"/>
  <rect x="3" y="11" width="4" height="1" fill="#d94f4f"/>
  <!-- tunic -->
  <rect x="10" y="10" width="6" height="1" fill="#fdf6ec"/>
  <rect x="8" y="11" width="8" height="2" fill="#fdf6ec"/>
  <rect x="8" y="13" width="8" height="1" fill="#6b4423"/>
  <rect x="11" y="13" width="2" height="1" fill="#f6c453"/>
  <rect x="8" y="14" width="8" height="1" fill="#fdf6ec"/>
  <!-- back arm visible -->
  <rect x="6" y="11" width="2" height="2" fill="#3e3a7a"/>
  <rect x="6" y="13" width="1" height="2" fill="#ffd9b3"/>
  <!-- legs passing under body -->
  <rect x="9" y="15" width="6" height="1" fill="#5046a8"/>
  <rect x="10" y="16" width="2" height="6" fill="#5046a8"/>
  <rect x="12" y="16" width="2" height="6" fill="#5046a8"/>
  <rect x="9" y="22" width="4" height="2" fill="#6b4423"/>
  <rect x="9" y="24" width="4" height="1" fill="#2b2135"/>
  <rect x="12" y="22" width="4" height="2" fill="#6b4423"/>
  <rect x="12" y="24" width="4" height="1" fill="#2b2135"/>
</svg>
