name: Deployment Production

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: semeton-corp/momenia-admin-client

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: image
        run: |
          echo "latest=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"
          echo "sha=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ steps.image.outputs.latest }}
            ${{ steps.image.outputs.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}

      - name: Run Trivy image scan
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.image.outputs.sha }}
          format: table
          output: trivy-image-results.txt
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          hide-progress: true
          exit-code: 1

      - name: Publish Trivy image scan results
        if: always()
        run: |
          if [[ -s trivy-image-results.txt ]]; then
            {
              echo "### Trivy Image Scan"
              echo "<details><summary>Click to expand</summary>"
              echo ""
              echo '```text'
              cat trivy-image-results.txt
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail on Trivy image findings
        if: steps.trivy.outcome == 'failure'
        run: |
          if [[ -s trivy-image-results.txt ]]; then
            cat trivy-image-results.txt
          else
            echo "Trivy image scan failed before writing a report. Check the 'Run Trivy image scan' step logs."
          fi
          exit 1

      - name: Push image
        run: |
          docker push "${{ steps.image.outputs.latest }}"
          docker push "${{ steps.image.outputs.sha }}"

      - name: Write image artifact
        run: |
          {
            echo "${{ steps.image.outputs.latest }}"
            echo "${{ steps.image.outputs.sha }}"
          } > image.txt

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: momenia-admin-client-image-${{ github.sha }}
          path: image.txt
